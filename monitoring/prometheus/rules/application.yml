groups:
  - name: daynomy-application
    rules:
      - alert: BackendMetricsUnavailable
        expr: up{job="backend", environment="prod"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '운영 백엔드 메트릭 수집 중단'
          description: '{{ $labels.instance }}의 Actuator 메트릭을 2분 이상 수집하지 못했습니다.'

      - alert: BackendMetricsUnavailableDev
        expr: up{job="backend", environment="dev"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '개발 백엔드 메트릭 수집 중단'
          description: '{{ $labels.instance }}의 Actuator 메트릭을 5분 이상 수집하지 못했습니다.'

      - alert: BackendHighErrorRate
        expr: |
          (
            sum by (environment, instance, service) (
              increase(http_server_requests_seconds_count{environment="prod", status=~"5.."}[5m])
            )
            /
            clamp_min(
              sum by (environment, instance, service) (
                increase(http_server_requests_seconds_count{environment="prod"}[5m])
              ),
              1
            )
          ) > 0.05
          and
          sum by (environment, instance, service) (
            increase(http_server_requests_seconds_count{environment="prod", status=~"5.."}[5m])
          ) >= 5
          and
          sum by (environment, instance, service) (
            increase(http_server_requests_seconds_count{environment="prod"}[5m])
          ) >= 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '운영 백엔드 5xx 비율 증가'
          description: '{{ $labels.instance }}에서 최근 5분간 요청 20건 이상, 5xx 5건 이상이며 오류 비율이 5%를 초과한 상태가 2분간 지속됐습니다.'

      - alert: BackendHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, environment, instance, service) (
              rate(http_server_requests_seconds_bucket{
                environment="prod",
                uri!~"/api/admin/.*|/api/news/\\{newsId\\}/portfolio-analysis"
              }[5m])
            )
          ) > 2
          and
          sum by (environment, instance, service) (
            increase(http_server_requests_seconds_count{
              environment="prod",
              uri!~"/api/admin/.*|/api/news/\\{newsId\\}/portfolio-analysis"
            }[10m])
          ) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '운영 핵심 API p95 응답 지연'
          description: '{{ $labels.instance }}에서 관리자·AI 장기 요청을 제외한 최근 10분 요청이 20건 이상이고 p95 응답 시간이 2초를 초과한 상태가 5분간 지속됐습니다.'

      - alert: JvmHeapUsageHigh
        expr: |
          sum by (environment, instance, service) (
            jvm_memory_used_bytes{environment="prod", area="heap"}
          )
          /
          sum by (environment, instance, service) (
            jvm_memory_max_bytes{environment="prod", area="heap"}
          )
          > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '운영 JVM Heap 사용률 증가'
          description: '{{ $labels.instance }}의 Heap 사용률이 15분 이상 90%를 초과했습니다.'

      - alert: DatabaseConnectionPoolWaiting
        expr: hikaricp_connections_pending{environment="prod"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '운영 DB 커넥션 풀 대기 지속'
          description: '{{ $labels.instance }}에서 DB 커넥션을 기다리는 요청이 5분 이상 존재합니다.'

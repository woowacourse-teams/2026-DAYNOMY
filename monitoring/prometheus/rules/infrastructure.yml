groups:
  - name: daynomy-infrastructure
    rules:
      - alert: ProductionEc2MetricsMissing
        expr: |
          absent_over_time(
            node_uname_info{environment="prod", instance="ec2-daynomy-server-prod"}[3m]
          )
          or
          absent_over_time(
            node_uname_info{environment="prod", instance="ec2-daynomy-db-prod"}[3m]
          )
        labels:
          severity: critical
        annotations:
          summary: '운영 EC2 메트릭 중단'
          description: '{{ $labels.instance }}에서 3분 이상 호스트 메트릭이 도착하지 않습니다. EC2, Alloy, 네트워크 상태를 확인하세요.'

      - alert: DevelopmentEc2MetricsMissing
        expr: |
          absent_over_time(
            node_uname_info{environment="dev", instance="ec2-daynomy-server-dev"}[5m]
          )
          or
          absent_over_time(
            node_uname_info{environment="dev", instance="ec2-daynomy-db-dev"}[5m]
          )
        labels:
          severity: warning
        annotations:
          summary: '개발 EC2 메트릭 중단'
          description: '{{ $labels.instance }}에서 5분 이상 호스트 메트릭이 도착하지 않습니다. EC2, Alloy, 네트워크 상태를 확인하세요.'

      - alert: PublicEndpointUnavailable
        expr: probe_success{job="blackbox-http", environment="prod"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '운영 공개 엔드포인트 접근 실패'
          description: '{{ $labels.instance }}에 2분 이상 접근할 수 없습니다.'

      - alert: PublicEndpointUnavailableDev
        expr: probe_success{job="blackbox-http", environment="dev"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '개발 공개 엔드포인트 접근 실패'
          description: '{{ $labels.instance }}에 5분 이상 접근할 수 없습니다.'

      - alert: TlsCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 24 * 60 * 60
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'TLS 인증서 만료 임박'
          description: '{{ $labels.instance }} 인증서 만료까지 14일 미만 남았습니다.'

      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{
            fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/boot.*"
          }
          /
          node_filesystem_size_bytes{
            fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/boot.*"
          } < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'EC2 디스크 여유 공간 부족'
          description: '{{ $labels.environment }} {{ $labels.instance }}의 {{ $labels.mountpoint }} 여유 공간이 15% 미만입니다.'

      - alert: PostgresUnavailable
        expr: pg_up{environment="prod"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '운영 PostgreSQL 연결 실패'
          description: '{{ $labels.instance }}의 PostgreSQL에 2분 이상 연결하지 못했습니다.'

      - alert: PostgresUnavailableDev
        expr: pg_up{environment="dev"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '개발 PostgreSQL 연결 실패'
          description: '{{ $labels.instance }}의 PostgreSQL에 5분 이상 연결하지 못했습니다.'

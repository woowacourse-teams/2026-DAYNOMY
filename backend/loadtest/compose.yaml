name: daynomy-loadtest-496
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daynomy_loadtest
      POSTGRES_USER: daynomy_loadtest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run manage.py prepare first}
    ports:
      - "127.0.0.1:55496:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daynomy_loadtest -d daynomy_loadtest"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:

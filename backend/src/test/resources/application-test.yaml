server:
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

  datasource:
    url: jdbc:tc:postgresql:16-alpine:///daynomy
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client
            client-secret: test-secret

jwt:
  issuer: daynomy-test
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

app:
  cors:
    allowed-origin: http://localhost:5173
  oauth2:
    success-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}
    failure-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}/login?error=oauth
  storage:
    s3:
      region: ap-northeast-2
      bucket: test-bucket
      object-prefix: daynomy
      public-base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com/daynomy

cookie:
  secure: false

external:
  public-data:
    service-key: test-service-key

exchange-rate:
  sync:
    enabled: false

investment-calendar:
  sync:
    enabled: false

stock:
  us:
    sync:
      enabled: false
      retry:
        delay: 0ms

spring:
  config:
    activate:
      on-profile: dev

news:
  generation:
    economy:
      enabled: false

stock:
  calendar:
    sync:
      enabled: ${MARKET_CALENDAR_SYNC_ENABLED:true}
  price:
    sync:
      enabled: ${STOCK_PRICE_SYNC_ENABLED:true}

league:
  calculation:
    enabled: ${LEAGUE_CALCULATION_ENABLED:true}

logging:
  level:
    org.grit.daynomy: DEBUG

management:
  metrics:
    tags:
      environment: dev
  opentelemetry:
    resource-attributes:
      deployment.environment.name: dev
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TEMPO_OTEL_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TEMPO_OTEL_ENABLED:false}

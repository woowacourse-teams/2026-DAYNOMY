spring:
  config:
    activate:
      on-profile: prod

news:
  generation:
    economy:
      enabled: true

stock:
  calendar:
    sync:
      enabled: ${MARKET_CALENDAR_SYNC_ENABLED:true}
  price:
    sync:
      enabled: ${STOCK_PRICE_SYNC_ENABLED:true}

portfolio:
  snapshot:
    enabled: true

league:
  calculation:
    enabled: ${LEAGUE_CALCULATION_ENABLED:true}

person:
  post-collection:
    enabled: ${PERSON_POST_COLLECTION_ENABLED:true}

app:
  oauth2:
    success-redirect-uri: /
    failure-redirect-uri: /login?error=oauth

management:
  metrics:
    tags:
      environment: prod
  tracing:
    export:
      otlp:
        enabled: false

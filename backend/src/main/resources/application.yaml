spring:
  application:
    name: daynomy
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"    
  jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

app:
  oauth2:
    success-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}
    failure-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}/login?error=oauth

jwt:
  issuer: daynomy
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:1209600000}

cookie:
  secure: ${COOKIE_SECURE:false}
  

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

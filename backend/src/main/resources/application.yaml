spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: daynomy

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    postgresql:
      # Concurrent index creation requires session-level advisory locks.
      transactional-lock: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  observations:
    annotations:
      enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_SERVER_PORT:8081}
  tracing:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: local
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,2s

app:
  cors:
    allowed-origin: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth2:
    success-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}
    failure-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}/login?error=oauth
  storage:
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      object-prefix: ${AWS_S3_OBJECT_PREFIX:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}

jwt:
  issuer: daynomy
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:1209600000}

cookie:
  secure: ${COOKIE_SECURE:false}

content-interaction:
  anonymous-token-secret: ${CONTENT_INTERACTION_ANONYMOUS_TOKEN_SECRET:${jwt.secret}}
  rate-limit-per-minute: ${CONTENT_INTERACTION_RATE_LIMIT_PER_MINUTE:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

external:
  krx-calendar:
    base-url: https://open.krx.co.kr
    connect-timeout: 3s
    read-timeout: 10s
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
    economy-news-model: ${OPENAI_ECONOMY_NEWS_MODEL:gpt-5.5}
    social-search-model: ${OPENAI_SOCIAL_SEARCH_MODEL:gpt-5-mini}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:120s}

  wikimedia:
    base-url: ${WIKIMEDIA_BASE_URL:https://commons.wikimedia.org}
    user-agent: ${WIKIMEDIA_USER_AGENT:daynomy/1.0}
    connect-timeout: ${WIKIMEDIA_CONNECT_TIMEOUT:3s}
    read-timeout: ${WIKIMEDIA_READ_TIMEOUT:15s}

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    connect-timeout: ${YOUTUBE_CONNECT_TIMEOUT:3s}
    read-timeout: ${YOUTUBE_READ_TIMEOUT:10s}

  eodhd:
    api-token: ${EODHD_API_TOKEN:}
    base-url: https://eodhd.com/api
    connect-timeout: 3s
    read-timeout: 60s

  public-data:
    service-key: ${PUBLIC_DATA_SERVICE_KEY}
    stock-price-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo
    etf-price-url: https://apis.data.go.kr/1160100/GetSecuritiesProductInfoService_V2/getETFPriceInfo_V2
    listed-stock-url: https://apis.data.go.kr/1160100/GetKrxListedInfoService_V2/getItemInfo_V2
    connect-timeout: ${PUBLIC_DATA_CONNECT_TIMEOUT:3s}
    read-timeout: ${PUBLIC_DATA_READ_TIMEOUT:10s}

  investment-calendar:
    connect-timeout: ${INVESTMENT_CALENDAR_CONNECT_TIMEOUT:3s}
    read-timeout: ${INVESTMENT_CALENDAR_READ_TIMEOUT:15s}
    bls-base-url: ${BLS_BASE_URL:https://api.bls.gov/publicAPI/v2}
    bls-schedule-url: ${BLS_SCHEDULE_URL:https://www.bls.gov/schedule/news_release/cpi.htm}
    bok-base-url: ${BOK_BASE_URL:https://www.bok.or.kr}
    ecos-base-url: ${ECOS_BASE_URL:https://ecos.bok.or.kr/api}
    ecos-api-key: ${ECOS_API_KEY:}
    dart-base-url: ${DART_BASE_URL:https://opendart.fss.or.kr/api}
    dart-api-key: ${DART_API_KEY:}

ai:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}

news:
  generation:
    korea:
      enabled: ${KOREAN_NEWS_GENERATION_ENABLED:${ECONOMY_NEWS_GENERATION_ENABLED:${news.generation.economy.enabled:false}}}
      cron: ${KOREAN_NEWS_GENERATION_CRON:${ECONOMY_NEWS_GENERATION_CRON:0 0 9 * * *}}
    us:
      enabled: ${US_NEWS_GENERATION_ENABLED:false}
      cron: ${US_NEWS_GENERATION_CRON:0 0 9 * * *}

person:
  post-collection:
    enabled: ${PERSON_POST_COLLECTION_ENABLED:false}
    cron: ${PERSON_POST_COLLECTION_CRON:0 0 6 * * *}
    lookback-days: ${PERSON_POST_COLLECTION_LOOKBACK_DAYS:3}

stock:
  us:
    sync:
      enabled: ${US_STOCK_SYNC_ENABLED:false}
      cron: ${US_STOCK_SYNC_CRON:0 15 6 * * *}
  calendar:
    sync:
      enabled: ${MARKET_CALENDAR_SYNC_ENABLED:false}
      cron: ${MARKET_CALENDAR_SYNC_CRON:0 5 6,18 * * *}
  sync:
    enabled: ${STOCK_SYNC_ENABLED:false}
    cron: ${STOCK_SYNC_CRON:0 10 14 * * MON-FRI}
  price:
    sync:
      enabled: ${STOCK_PRICE_SYNC_ENABLED:false}
      cron: ${STOCK_PRICE_SYNC_CRON:0 30 14,18 * * MON-FRI}

exchange-rate:
  sync:
    enabled: ${EXCHANGE_RATE_SYNC_ENABLED:false}
    cron: ${EXCHANGE_RATE_SYNC_CRON:0 10 6 * * *}

portfolio:
  analysis:
    model: ${PORTFOLIO_ANALYSIS_MODEL:${OPENAI_MODEL:gpt-5-mini}}
    cache-ttl: ${PORTFOLIO_ANALYSIS_CACHE_TTL:30m}
    batch-size: ${PORTFOLIO_ANALYSIS_BATCH_SIZE:1}
  snapshot:
    enabled: ${PORTFOLIO_SNAPSHOT_ENABLED:false}
    cron: ${PORTFOLIO_SNAPSHOT_CRON:0 30 7 * * TUE-SAT}

league:
  calculation:
    enabled: ${LEAGUE_CALCULATION_ENABLED:false}
    cron: ${LEAGUE_CALCULATION_CRON:0 20 17 * * MON-FRI}

investment-calendar:
  sync:
    enabled: ${INVESTMENT_CALENDAR_SYNC_ENABLED:false}
    cron: ${INVESTMENT_CALENDAR_SYNC_CRON:0 0 4 * * *}
    history-years: ${INVESTMENT_CALENDAR_HISTORY_YEARS:5}
    dart-lookback-days: ${INVESTMENT_CALENDAR_DART_LOOKBACK_DAYS:30}

email:
  analysis:
    enabled: ${EMAIL_ANALYSIS_ENABLED:false}
    cost-verified: ${EMAIL_ANALYSIS_COST_VERIFIED:false}
    model: ${portfolio.analysis.model}
    daily-usd: ${EMAIL_ANALYSIS_DAILY_USD:0}
    monthly-usd: ${EMAIL_ANALYSIS_MONTHLY_USD:0}
    reserve-usd: ${EMAIL_ANALYSIS_RESERVE_USD:0}
    input-usd-per-million: ${EMAIL_ANALYSIS_INPUT_USD_PER_MILLION:0}
    cached-usd-per-million: ${EMAIL_ANALYSIS_CACHED_USD_PER_MILLION:0}
    output-usd-per-million: ${EMAIL_ANALYSIS_OUTPUT_USD_PER_MILLION:0}
    search-usd-per-call: ${EMAIL_ANALYSIS_SEARCH_USD_PER_CALL:0}
    max-output-tokens: ${EMAIL_ANALYSIS_MAX_OUTPUT_TOKENS:0}
    max-tool-calls: ${EMAIL_ANALYSIS_MAX_TOOL_CALLS:0}

logging:
  structured:
    format:
      console: logstash

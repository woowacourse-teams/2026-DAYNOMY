spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: daynomy

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origin: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth2:
    success-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}
    failure-redirect-uri: ${FRONTEND_BASE_URL:http://localhost:5173}/login?error=oauth
  storage:
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL}

jwt:
  issuer: daynomy
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:1209600000}

cookie:
  secure: ${COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

external:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
    economy-news-model: ${OPENAI_ECONOMY_NEWS_MODEL:gpt-5.5}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_READ_TIMEOUT:120s}

  public-data:
    service-key: ${PUBLIC_DATA_SERVICE_KEY}
    stock-price-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo
    listed-stock-url: https://apis.data.go.kr/1160100/GetKrxListedInfoService_V2/getItemInfo_V2
    connect-timeout: ${PUBLIC_DATA_CONNECT_TIMEOUT:3s}
    read-timeout: ${PUBLIC_DATA_READ_TIMEOUT:10s}

ai:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5-mini}

news:
  generation:
    economy:
      enabled: ${ECONOMY_NEWS_GENERATION_ENABLED:true}
      cron: ${ECONOMY_NEWS_GENERATION_CRON:0 0 9 * * *}

stock:
  sync:
    enabled: ${STOCK_SYNC_ENABLED:false}
    cron: ${STOCK_SYNC_CRON:0 10 14 * * MON-FRI}
  price:
    sync:
      enabled: ${STOCK_PRICE_SYNC_ENABLED:false}
      cron: ${STOCK_PRICE_SYNC_CRON:0 30 14 * * MON-FRI}

logging:
  structured:
    format:
      console: logstash

name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'backend/**'
      - 'monitoring/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Validate Market Calendar Tool
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate Monitoring Rules
        working-directory: monitoring/prometheus
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/rules:ro" -w /rules prom/prometheus:v3.5.0 check rules rules/application.yml rules/infrastructure.yml rules/league.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD:/rules:ro" -w /rules prom/prometheus:v3.5.0 test rules tests/league.test.yml

      - name: Run Tests and Build Project
        run: ./gradlew clean build

            0lQdMxHkNNoJD3dM1RNv2dCbaDiwYvKtX0yOLTvaz6GUthM+RAAz9czzSIxrAu99
            mF1ivjgXiQ1+6XzIi04BnkHuJCxj3SQQ1yUTRW3yqDOQNWzYsFdmerAhT2agqrZ1
            OJXGifxXdWRyvQWaLfa3ydiytBL7mtXmMtG+Eg+qrxcpVmyqw1mT0RL+3z5apkkU
            MhtDT1CdAtJK6fdytg==
            -----END CERTIFICATE-----
        run: |
          python3 - <<'PYDIAG'
          import os, pathlib, subprocess
          instance = pathlib.Path('/sys/devices/virtual/dmi/id/board_asset_tag').read_text().strip()
          if instance != 'i-0f2e92d9c7bd8fe06':
              raise SystemExit('Refusing non-development instance')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          cert = root / 'startup-diagnostic.crt'
          cert.write_text(os.environ['DIAGNOSTIC_CERT'])
          journal = subprocess.run(['sudo', '-n', 'journalctl', '-u', 'daynomy-dev',
              '--since', '2026-11-24 14:34:00 UTC', '--until', '2026-11-24 14:39:00 UTC',
              '-n', '10000', '-o', 'json', '--no-pager'], capture_output=True, check=True)
          encrypted = subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes-256-cbc',
              '-outform', 'DER', str(cert)], input=journal.stdout, capture_output=True, check=True)
          output = root / 'startup-journal.der'
          output.write_bytes(encrypted.stdout)
          output.chmod(0o600)
          print('Encrypted startup journal generated; no plaintext was logged.')
          PYDIAG
      - name: Upload encrypted startup journal
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-startup-diagnostics-943
          path: ${{ runner.temp }}/startup-journal.der
          retention-days: 1

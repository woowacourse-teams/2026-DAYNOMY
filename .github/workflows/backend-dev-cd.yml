name: Deploy backend development

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-dev-cd.yml"

  workflow_dispatch:
    inputs:
      verify_only:
        description: Read development instance and API status without deploying
        type: boolean
        default: false
      bootstrap_bluegreen:
        description: Explicit one-time development two-slot installation after inspection
        type: boolean
        default: false
      nginx_site:
        description: Reviewed development Nginx site path for initial installation
        type: string
        default: /etc/nginx/conf.d/daynomy-site.conf
      backend_environment_file:
        description: Existing development backend environment file path
        type: string
        default: /home/ec2-user/backend/daynomy.env

permissions:
  contents: read

concurrency:
  group: development-backend
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    name: Test and build backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run formatting check
        run: ./gradlew spotlessCheck

      - name: Run tests and build
        run: ./gradlew clean build -PciTestSuite=main --no-daemon

      - name: Upload main test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dev-test-results-main
          path: backend/build/test-results/test/
          retention-days: 7
          if-no-files-found: warn

      - name: Prepare deployment JAR
        run: |
          JAR_PATH="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            -print \
            -quit)"

          if [ -z "$JAR_PATH" ]; then
            echo "Executable JAR was not found."
            exit 1
          fi

          cp "$JAR_PATH" "build/libs/daynomy-${GITHUB_SHA}.jar"

      - name: Upload deployment JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-dev-${{ github.sha }}
          path: backend/build/libs/daynomy-${{ github.sha }}.jar
          retention-days: 7

  heavy-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
    name: Test heavy preparation tools
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run heavy preparation tool tests
        run: ./gradlew test -PciTestSuite=heavy --no-daemon

      - name: Upload heavy test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dev-test-results-heavy
          path: backend/build/test-results/test/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    if: >
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !inputs.verify_only
    name: Deploy backend development
    needs: [build, heavy-tests]

    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - backend-dev

    environment: development

    steps:
      - name: Checkout development deployment tools
        uses: actions/checkout@v6

      - name: Download deployment JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-dev-${{ github.sha }}
          path: ${{ runner.temp }}/daynomy-backend-dev

      - name: Deploy and verify
        env:
          APP_VERSION: ${{ github.sha }}
          BOOTSTRAP_BLUEGREEN: ${{ inputs.bootstrap_bluegreen }}
          NGINX_SITE: ${{ inputs.nginx_site }}
          BACKEND_ENVIRONMENT_FILE: ${{ inputs.backend_environment_file }}
        run: |
          set -Eeuo pipefail

          APP_DIR="/home/ec2-user/backend"
          ARTIFACT="${RUNNER_TEMP}/daynomy-backend-dev/daynomy-${APP_VERSION}.jar"
          RELEASE="${APP_DIR}/releases/daynomy-${APP_VERSION}.jar"
          PREVIOUS="$(readlink -f "${APP_DIR}/current.jar" || true)"

          if [ "$BOOTSTRAP_BLUEGREEN" = "true" ]; then
            python3 backend/scripts/inspect_backend_development.py
            CURRENT_SHA="$(sha256sum "${APP_DIR}/current.jar" | awk '{print $1}')"
            sudo -n python3 backend/scripts/bootstrap_backend.py \
              --environment development --artifact "$ARTIFACT" \
              --site "$NGINX_SITE" --environment-file "$BACKEND_ENVIRONMENT_FILE"
            sudo -n python3 backend/scripts/bootstrap_backend.py \
              --environment development --artifact "$ARTIFACT" \
              --site "$NGINX_SITE" --environment-file "$BACKEND_ENVIRONMENT_FILE" \
              --expected-current-sha256 "$CURRENT_SHA" --apply
            exit 0
          fi

          # Bootstrap is an explicit one-time operation. Before it, retain restart deployment.
          if [ -d "${APP_DIR}/deployment-dev" ]; then
            sudo -n python3 backend/scripts/deploy_backend.py \
              --environment development \
              --artifact "$ARTIFACT" --version "$APP_VERSION"
            exit 0
          fi

          rollback() {
            echo "Rolling back development backend."

            if [ -n "$PREVIOUS" ] && [ -f "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "${APP_DIR}/current.jar"
              sudo -n systemctl restart daynomy-dev
            else
              echo "Previous release was not found."
            fi
          }

          if [ ! -f "$ARTIFACT" ]; then
            echo "Downloaded JAR was not found: $ARTIFACT"
            exit 1
          fi

          install -m 0644 "$ARTIFACT" "$RELEASE"
          ln -sfn "$RELEASE" "${APP_DIR}/current.jar"

          if ! sudo -n systemctl restart daynomy-dev; then
            rollback
            exit 1
          fi

          HEALTHY=false

          for _ in $(seq 1 45); do
            if curl \
              --fail \
              --silent \
              --max-time 5 \
              http://127.0.0.1:8081/actuator/health \
              >/dev/null; then
              HEALTHY=true
              break
            fi

            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "Development backend health check failed."
            rollback
            exit 1
          fi

          echo "Development backend deployment completed: ${APP_VERSION}"

      - name: Verify development instance and API
        if: always()
        run: python3 backend/scripts/inspect_backend_development.py

  verify-development:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/chore/BE/#943')
    name: Verify development without deployment
    runs-on: [self-hosted, Linux, ARM64, backend-dev]
    timeout-minutes: 5
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v6
      - name: Read development instance and API status
        run: python3 backend/scripts/inspect_backend_development.py
      - name: Export encrypted startup journal for local diagnosis
        env:
          DIAGNOSTIC_CERT: |
            -----BEGIN CERTIFICATE-----
            MIIEKTCCApGgAwIBAgIUWQATvYKBtKaY62QFjgomhGA5XlMwDQYJKoZIhvcNAQEL
            BQAwJDEiMCAGA1UEAwwZZGF5bm9teS1sb2NhbC1kaWFnbm9zdGljczAeFw0yNjEx
            MjQxNDU5NDdaFw0yNjExMjYxNDU5NDdaMCQxIjAgBgNVBAMMGWRheW5vbXktbG9j
            YWwtZGlhZ25vc3RpY3MwggGiMA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQCr
            RybTjEPJydyVBC99bRgUXAfUB7CodEYGSI5oMbG56WI4zy7Cry/DBiEf9qRpvxbx
            lSSpzq1kROAA+rIYpnyFTf3LQqNxsBrPoCdYfq+KIMRRwOykOYnQdr7nIAbf2FP0
            HjlY1Tfo5bMRNN/+EJAGE6B0C/EmUl3CGZQHGTHq+3GsCxTvnV55xmop05mV4cQv
            tZgjfa/+xihBn5NBnChsR/IY0KntE8rKjZHK9Uto4xmNoIQ+TUfHS93S4eLr0UJx
            tNFfzLdemO9XolkJuS0P2aYGhI0rGI6qH+btumuQsZj1sq25xAiLjhGGmt0PJWnJ
            kAJ6WQim2Q2y+D+4dt4mucjqORMB+BOEOREryGP82F97mPTKTf0RS/WuY2jrNX1L
            4DrtluxS6e4qV450Xbu71JkPKz+bJpX6qvIYKXaZa/oloXc7Cq3serlPmDMB9YrA
            VOZvTQJFuLvZXriH2LM6zunvb8TXXuQloLS01W6TmwgWh6anF5+8lZD9Afjw3ukC
            AwEAAaNTMFEwHQYDVR0OBBYEFGYr3qsW5pYkGVez2TFjyokftWvoMB8GA1UdIwQY

name: Deploy backend production

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backend-cd.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  build:
    name: Test and build backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run formatting check
        run: ./gradlew spotlessCheck

      - name: Run tests and build
        run: ./gradlew clean build --no-daemon

      - name: Prepare deployment JAR
        run: |
          JAR_PATH="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-plain.jar' \
            -print \
            -quit)"

          if [ -z "$JAR_PATH" ]; then
            echo "Executable JAR was not found."
            exit 1
          fi

          cp "$JAR_PATH" "build/libs/daynomy-${GITHUB_SHA}.jar"

      - name: Upload deployment JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: backend/build/libs/daynomy-${{ github.sha }}.jar
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Deploy backend
    needs: build
    runs-on: [ self-hosted, linux, ARM64, backend-prod ]
    environment: production

    steps:
      - name: Download deployment JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/daynomy-backend

      - name: Checkout deployment controller
        uses: actions/checkout@v6
        with:
          path: deployment-source

      - name: Test deployment controller
        run: python3 -B -m unittest discover -s deployment-source/backend/scripts -p 'test_*backend*.py'

      - name: Deploy and verify
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ARTIFACT="${RUNNER_TEMP}/daynomy-backend/daynomy-${APP_VERSION}.jar"
          STATE="/home/ec2-user/backend/deployment"
          if [ ! -f "${STATE}/active-slot" ]; then
            RELEASE="/home/ec2-user/backend/releases/daynomy-${APP_VERSION}.jar"
            if [ -e "$RELEASE" ]; then
              cmp --silent "$ARTIFACT" "$RELEASE"
            else
              install -m 0644 "$ARTIFACT" "$RELEASE"
            fi
            echo "Initial installation requires the reviewed bootstrap procedure and an external API observer."
            echo "Artifact is ready; no production service has been restarted."
            exit 1
          fi
          sudo -n install -m 0755 deployment-source/backend/scripts/deploy_backend.py /usr/local/libexec/daynomy/deploy_backend.py
          sudo -n python3 -B /usr/local/libexec/daynomy/deploy_backend.py \
            --environment production --artifact "$ARTIFACT" --version "$APP_VERSION"

      - name: Verify Nginx proxy
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --max-time 15 \
            https://daynomy.com/api/news \
            >/dev/null

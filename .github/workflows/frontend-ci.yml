name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Detect frontend changes
        id: changes
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"

          if grep -Eq '^(frontend/|\.github/workflows/(frontend-ci|deploy-frontend)\.yml$)' <<< "$changed_files"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    name: Frontend app checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test browser flows
        id: e2e
        run: npm run test:e2e

      - name: Upload failed browser test results
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 7

  deployment:
    name: Frontend deployment checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test deployment and cache policy
        run: bash frontend/scripts/test-deploy-frontend.sh

  verify:
    name: Frontend checks
    needs: [changes, app, deployment]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          APP_RESULT: ${{ needs.app.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_CHANGED" = false ]; then
            test "$APP_RESULT" = skipped
            test "$DEPLOYMENT_RESULT" = skipped
          else
            test "$FRONTEND_CHANGED" = true
            test "$APP_RESULT" = success
            test "$DEPLOYMENT_RESULT" = success
          fi

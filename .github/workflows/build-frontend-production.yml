name: Publish frontend production image

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - deploy/frontend/**
      - .github/workflows/build-frontend-production.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build and upload Sentry source maps
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          : "${SENTRY_DSN:?SENTRY_DSN is required}"
          : "${SENTRY_ENVIRONMENT:?SENTRY_ENVIRONMENT is required}"
          : "${GA_MEASUREMENT_ID:?GA_MEASUREMENT_ID is required}"
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required}"
          : "${SENTRY_ORG:?SENTRY_ORG is required}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT is required}"
          : "${SENTRY_RELEASE:?SENTRY_RELEASE is required}"
          npm run build

      - name: Verify source maps were removed
        run: |
          if find dist -type f -name "*.map" -print -quit | grep -q .; then
            echo "Source maps remain in dist"
            exit 1
          fi

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$IMAGE_NAME:main" \
            .

      - name: Validate Nginx configuration
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker run --rm "$IMAGE_NAME:$GITHUB_SHA" nginx -t

      - name: Smoke test container
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker run --detach --name frontend-smoke \
            --publish 127.0.0.1:3000:80 \
            "$IMAGE_NAME:$GITHUB_SHA"
          trap 'docker rm --force frontend-smoke >/dev/null 2>&1 || true' EXIT

          dump_container_logs() {
            docker ps --all --filter name=frontend-smoke || true
            docker inspect frontend-smoke --format '{{json .State}}' || true
            docker logs frontend-smoke || true
          }

          if ! curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/ >/dev/null; then
            dump_container_logs
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:3000/news/1 \
            | grep -q '<div id="root"></div>'; then
            dump_container_logs
            exit 1
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish container image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:main"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-publish
    runs-on: [self-hosted, linux, ARM64, frontend-prod]
    permissions:
      packages: read

    steps:
      - name: Deploy frontend
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export FRONTEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend:$GITHUB_SHA"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker compose --file /opt/daynomy/frontend/compose.yml pull
          docker compose --file /opt/daynomy/frontend/compose.yml up --detach --wait --remove-orphans

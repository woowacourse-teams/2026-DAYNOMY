name: Build and deploy frontend

on:
  push:
    branches:
      - dev
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      release_version: ${{ steps.release.outputs.release_version }}

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve frontend release
        id: release
        run: bash scripts/resolve-release-version.sh

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Check existing release image
        id: existing
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_error="$RUNNER_TEMP/frontend-manifest-error"
          if docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null 2>"$manifest_error"; then
            docker pull "$IMAGE_NAME:$IMAGE_TAG"
            image_commit="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME:$IMAGE_TAG")"
            if [ "$image_commit" != "$GITHUB_SHA" ]; then
              echo "Release image $IMAGE_TAG belongs to a different commit"
              exit 1
            fi
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|no such manifest' "$manifest_error"; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          else
            cat "$manifest_error" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test deployment and cache policy
        run: bash scripts/test-deploy-frontend.sh

      - name: Build and upload Sentry source maps
        if: steps.existing.outputs.reuse != 'true'
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ steps.release.outputs.image_tag }}
        run: |
          : "${SENTRY_ENVIRONMENT:?SENTRY_ENVIRONMENT is required}"

          if [ "$DEPLOY_ENV" = "production" ]; then
            : "${SENTRY_DSN:?SENTRY_DSN is required}"
            : "${GA_MEASUREMENT_ID:?GA_MEASUREMENT_ID is required}"
            : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required}"
            : "${SENTRY_ORG:?SENTRY_ORG is required}"
            : "${SENTRY_PROJECT:?SENTRY_PROJECT is required}"
          fi

          npm run "build:${DEPLOY_ENV}"
          marker="${DEPLOY_ENV}:${GITHUB_SHA}"
          sed -i "s|</head>|<meta name=\"daynomy-deployment\" content=\"$marker\" /></head>|" dist/index.html
          grep -Fq "name=\"daynomy-deployment\" content=\"$marker\"" dist/index.html

      - name: Verify source maps were removed
        if: steps.existing.outputs.reuse != 'true'
        run: |
          if find dist -type f -name "*.map" -print -quit | grep -q .; then
            echo "Source maps remain in dist"
            exit 1
          fi

      - name: Build container image
        if: steps.existing.outputs.reuse != 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker build \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Validate Nginx configuration
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: docker run --rm "$IMAGE_NAME:$IMAGE_TAG" nginx -t

      - name: Smoke test container
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          docker run --detach --name frontend-smoke \
            --publish 127.0.0.1:3000:80 \
            "$IMAGE_NAME:$IMAGE_TAG"
          trap 'docker rm --force frontend-smoke >/dev/null 2>&1 || true' EXIT

          dump_container_logs() {
            docker ps --all --filter name=frontend-smoke || true
            docker inspect frontend-smoke --format '{{json .State}}' || true
            docker logs frontend-smoke || true
          }

          if ! curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/ --output "$RUNNER_TEMP/frontend-smoke.html"; then
            dump_container_logs
            exit 1
          fi

          for path in / /index.html /news/1; do
            curl --fail --silent --head "http://127.0.0.1:3000$path" \
              | grep -qi '^Cache-Control: no-cache'
          done

          hashed_assets="$(grep -oE '/assets/[^" ]+-[A-Za-z0-9_-]{8}\.(js|css)' "$RUNNER_TEMP/frontend-smoke.html" | sort -u)"
          test -n "$hashed_assets"
          while IFS= read -r asset; do
            curl --fail --silent --head "http://127.0.0.1:3000$asset" \
              | grep -qi '^Cache-Control: public, max-age=31536000, immutable'
          done <<< "$hashed_assets"

          if ! curl --fail --silent http://127.0.0.1:3000/news/1 \
            | grep -q '<div id="root"></div>'; then
            dump_container_logs
            exit 1
          fi

      - name: Publish container image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          REUSE_IMAGE: ${{ steps.existing.outputs.reuse }}
        run: |
          if [ "$REUSE_IMAGE" != true ]; then
            docker push "$IMAGE_NAME:$IMAGE_TAG"
          fi
          if [ "$IMAGE_TAG" != "$GITHUB_SHA" ]; then
            docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$GITHUB_SHA"
            docker push "$IMAGE_NAME:$GITHUB_SHA"
          fi
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"

  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: build-and-publish
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - ${{ github.ref == 'refs/heads/main' && 'frontend-prod' || 'frontend-dev' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://daynomy.com' || 'https://dev.daynomy.com' }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      DEPLOY_URL: ${{ github.ref == 'refs/heads/main' && 'https://daynomy.com' || 'https://dev.daynomy.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy frontend
        env:
          GHCR_TOKEN: ${{ github.token }}
          DEPLOY_VERSION: ${{ needs.build-and-publish.outputs.image_tag }}
        run: |
          set -Eeuo pipefail

          export FRONTEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend:$DEPLOY_VERSION"
          export COMPOSE_FILE="$GITHUB_WORKSPACE/frontend/compose.yml"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker pull "$FRONTEND_IMAGE"
          bash frontend/scripts/deploy-frontend.sh

      - name: Verify API and OAuth routing
        run: |
          set -Eeuo pipefail
          report_result() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo 'Backend routing check failed; the verified frontend image is retained'
              echo 'Backend routing check failed. Frontend rollback was not applied.' >> "$GITHUB_STEP_SUMMARY" || true
            fi
            exit "$status"
          }
          trap report_result EXIT

          # TODO: 개발용 자동 로그인 수단과 복구 가능한 테스트 데이터가 제공되면 인증·쓰기 API를 검증.

          for path in /api/news /api/auth/csrf; do
            content_type="$(curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 2 \
              --max-time 15 --output /dev/null --write-out '%{content_type}' \
              "$DEPLOY_URL$path")"
            if [[ "$content_type" != application/json* ]]; then
              echo "Expected JSON from $path, got $content_type"
              exit 1
            fi
          done

          login_redirect="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{redirect_url}' \
            "$DEPLOY_URL/api/auth/google")"
          if [ "$login_redirect" != "$DEPLOY_URL/oauth2/authorization/google" ]; then
            echo "Expected Google login redirect, got $login_redirect"
            exit 1
          fi

          oauth_status="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_URL/oauth2/authorization/google")"
          if [ "$oauth_status" != 302 ]; then
            echo "Expected OAuth redirect, got HTTP $oauth_status"
            exit 1
          fi

  tag-release:
    if: needs.build-and-publish.outputs.release_version != ''
    needs:
      - build-and-publish
      - deploy
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag verified frontend release
        env:
          RELEASE_VERSION: ${{ needs.build-and-publish.outputs.release_version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")" = "$GITHUB_SHA"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_VERSION" -m "frontend $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

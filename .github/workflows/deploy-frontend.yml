name: Build and deploy frontend

on:
  push:
    branches:
      - dev
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build and upload Sentry source maps
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          : "${SENTRY_ENVIRONMENT:?SENTRY_ENVIRONMENT is required}"
          : "${SENTRY_RELEASE:?SENTRY_RELEASE is required}"

          if [ "$DEPLOY_ENV" = "production" ]; then
            : "${SENTRY_DSN:?SENTRY_DSN is required}"
            : "${GA_MEASUREMENT_ID:?GA_MEASUREMENT_ID is required}"
            : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required}"
            : "${SENTRY_ORG:?SENTRY_ORG is required}"
            : "${SENTRY_PROJECT:?SENTRY_PROJECT is required}"
          fi

          npm run "build:${DEPLOY_ENV}"
          marker="${DEPLOY_ENV}:${GITHUB_SHA}"
          sed -i "s|</head>|<meta name=\"daynomy-deployment\" content=\"$marker\" /></head>|" dist/index.html
          grep -Fq "name=\"daynomy-deployment\" content=\"$marker\"" dist/index.html

      - name: Verify source maps were removed
        run: |
          if find dist -type f -name "*.map" -print -quit | grep -q .; then
            echo "Source maps remain in dist"
            exit 1
          fi

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - name: Build container image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$IMAGE_NAME:$GITHUB_REF_NAME" \
            .

      - name: Validate Nginx configuration
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: docker run --rm "$IMAGE_NAME:$GITHUB_SHA" nginx -t

      - name: Smoke test container
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker run --detach --name frontend-smoke \
            --publish 127.0.0.1:3000:80 \
            "$IMAGE_NAME:$GITHUB_SHA"
          trap 'docker rm --force frontend-smoke >/dev/null 2>&1 || true' EXIT

          dump_container_logs() {
            docker ps --all --filter name=frontend-smoke || true
            docker inspect frontend-smoke --format '{{json .State}}' || true
            docker logs frontend-smoke || true
          }

          if ! curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/ >/dev/null; then
            dump_container_logs
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:3000/news/1 \
            | grep -q '<div id="root"></div>'; then
            dump_container_logs
            exit 1
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish container image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"

  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: build-and-publish
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - ${{ github.ref == 'refs/heads/main' && 'frontend-prod' || 'frontend-dev' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://daynomy.com' || 'https://dev.daynomy.com' }}
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      DEPLOY_URL: ${{ github.ref == 'refs/heads/main' && 'https://daynomy.com' || 'https://dev.daynomy.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy frontend
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          export FRONTEND_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend:$GITHUB_SHA"
          compose_file="$GITHUB_WORKSPACE/frontend/compose.yml"
          if [ "$DEPLOY_ENV" = "production" ]; then
            compose_file="/opt/daynomy/frontend/compose.yml"
          fi
          compose=(docker compose --file "$compose_file")

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          "${compose[@]}" pull

          "${compose[@]}" up --detach --wait --remove-orphans

      - name: Verify deployment
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 2 \
            --max-time 15 \
            "$DEPLOY_URL/" \
            --output "$RUNNER_TEMP/daynomy-frontend.html"

          grep -Fq '<div id="root"></div>' "$RUNNER_TEMP/daynomy-frontend.html"
          grep -Fq "name=\"daynomy-deployment\" content=\"$DEPLOY_ENV:$GITHUB_SHA\"" \
            "$RUNNER_TEMP/daynomy-frontend.html"

      - name: Verify API and OAuth routing
        run: |
          set -euo pipefail

          # TODO: 개발용 자동 로그인 수단과 복구 가능한 테스트 데이터가 제공되면 인증·쓰기 API를 검증.

          for path in /api/news /api/auth/csrf; do
            content_type="$(curl --fail --silent --show-error \
              --retry 10 --retry-all-errors --retry-delay 2 \
              --max-time 15 --output /dev/null --write-out '%{content_type}' \
              "$DEPLOY_URL$path")"
            if [[ "$content_type" != application/json* ]]; then
              echo "Expected JSON from $path, got $content_type"
              exit 1
            fi
          done

          login_redirect="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{redirect_url}' \
            "$DEPLOY_URL/api/auth/google")"
          if [ "$login_redirect" != "$DEPLOY_URL/oauth2/authorization/google" ]; then
            echo "Expected Google login redirect, got $login_redirect"
            exit 1
          fi

          oauth_status="$(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_URL/oauth2/authorization/google")"
          if [ "$oauth_status" != 302 ]; then
            echo "Expected OAuth redirect, got HTTP $oauth_status"
            exit 1
          fi

"⚙️ BE":
  - changed-files:
      - any-glob-to-any-file: "backend/**"

"🖥️ FE":
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

"🧹 chore":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "*.gradle"
          - "*.gradle.kts"
          - "gradle/**"
          - "backend/gradle/**"
          - "backend/gradlew"
          - "backend/gradlew.bat"
          - "frontend/package.json"
          - "frontend/package-lock.json"
          - "frontend/tsconfig*.json"
          - "frontend/vite.config.ts"

"📃 docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

"✅ test":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/src/test/**"
          - "frontend/tests/**"
          - "**/*.test.*"
          - "**/*.spec.*"

